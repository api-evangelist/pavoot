openapi: 3.2.0
info:
  title: Fast Get Project Attendee Email Template API
  version: 0.1.0
tags:
- name: GetProjectAttendeeEmailTemplate
paths:
  /getProjectAttendeeEmailTemplate:
    get:
      summary: Get Project Attendee Email Template Endpoint
      description: Returns the email template (subject, bodyHtml) for attendee share link emails.
      operationId: get_project_attendee_email_template_endpoint_getProjectAttendeeEmailTemplate_get
      parameters:
      - name: projectId
        in: query
        required: true
        schema:
          type: integer
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetProjectAttendeeEmailTemplate
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
