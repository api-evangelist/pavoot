openapi: 3.2.0
info:
  title: Fast Get Storage API
  version: 0.1.0
tags:
- name: GetStorage
paths:
  /getStorage:
    get:
      summary: Get Storage Endpoint
      description: 'Returns used storage (GB) and limit (GB) for the relevant organization.


        - mode=event_organizer: use auth user''s id as event_organizer_id, resolve to organization.

        - mode=photographer: require projectId, resolve one event_organizer from event_organizer_projects, then their organization.


        Only event_organizer, photographer, and admin roles may call this; recipients are not allowed.'
      operationId: get_storage_endpoint_getStorage_get
      parameters:
      - name: mode
        in: query
        required: true
        schema:
          type: string
          description: event_organizer or photographer
          title: Mode
        description: event_organizer or photographer
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Required when mode=photographer
          title: Projectid
        description: Required when mode=photographer
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetStorage
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
