openapi: 3.2.0
info:
  title: Fast Edit Photographer API
  version: 0.1.0
tags:
- name: EditPhotographer
paths:
  /editPhotographer:
    post:
      summary: Edit Photographer Endpoint
      description: "Updates a photographer's information in the database.\n\nExpects:\n    - JSON with:\n        - 'id': unique identifier of the photographer (required)\n        - 'name': new name for the photographer (optional)\n        - 'description': new description for the photographer (optional)\n        - 'projectId'\n\nReturns:\n    - Success message if photographer was found and updated\n    - Error if photographer not found or other issues occur"
      operationId: edit_photographer_endpoint_editPhotographer_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - EditPhotographer
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
