openapi: 3.2.0
info:
  title: Fast Get Images API
  version: 0.1.0
tags:
- name: GetImages
paths:
  /getImages:
    get:
      summary: Get Images Endpoint
      description: 'Endpoint for retrieving images with optional filters.

        Note: aiQuery should be sent via POST /searchImages endpoint.'
      operationId: get_images_endpoint_getImages_get
      parameters:
      - name: id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      - name: startDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Startdate
      - name: endDate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Enddate
      - name: imageTitle
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Imagetitle
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Projectids[]
      - name: photographerId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Photographerid
      - name: folderName
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Foldername
      - name: personCategory
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Personcategory
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          default: []
          title: Tags
      - name: tagsByCategory
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tagsbycategory
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 10
          title: Pagesize
      - name: dateTakenStart
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Datetakenstart
      - name: dateTakenEnd
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Datetakenend
      - name: dateUploadedStart
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dateuploadedstart
      - name: dateUploadedEnd
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dateuploadedend
      - name: filterTagsWithOr
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Filtertagswithor
      - name: sortBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sortby
      - name: dateTakenNull
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Datetakennull
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetImages
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
