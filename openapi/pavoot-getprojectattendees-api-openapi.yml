openapi: 3.2.0
info:
  title: Fast Get Project Attendees API
  version: 0.1.0
tags:
- name: GetProjectAttendees
paths:
  /getProjectAttendees:
    get:
      summary: Get Project Attendees Endpoint
      description: 'Returns only attendees (category = ''Attendee'' or ''Attendees''), joined with project_attendees

        (email, share_link, status) and image_count. Unlabeled/person are not shown in the list but

        can be used in merge suggestions (getPotentialDuplicates / getFaceMatchSuggestions).


        Returns every attendee by default; `limit`/`offset` are opt-in and the response

        carries `total`/`hasMore`.'
      operationId: get_project_attendees_endpoint_getProjectAttendees_get
      parameters:
      - name: projectId
        in: query
        required: true
        schema:
          type: integer
          title: Projectid
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetProjectAttendees
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
