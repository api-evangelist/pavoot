openapi: 3.2.0
info:
  title: Fast Invite Recipient API
  version: 0.1.0
tags:
- name: InviteRecipient
paths:
  /inviteRecipient:
    post:
      summary: Invite Recipient Endpoint
      description: "Invites a recipient by generating a password, saving them to the database, and sending an email.\n\nExpects:\n    - JSON with:\n        - 'name': recipient's name\n        - 'email': recipient's email\n        - 'description': recipient's description\n        - 'projectId': ID of the project to associate with\n\nReturns:\n    - Success message with clerk_user_id if successful\n    - Error if required fields are missing or other issues occur"
      operationId: invite_recipient_endpoint_inviteRecipient_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - InviteRecipient
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
