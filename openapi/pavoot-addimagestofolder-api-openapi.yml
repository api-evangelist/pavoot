openapi: 3.2.0
info:
  title: Fast Add Images To Folder API
  version: 0.1.0
tags:
- name: AddImagesToFolder
paths:
  /addImagesToFolder:
    post:
      summary: Add Image To Folder Endpoint
      description: 'Associates multiple images with a folder by adding the folder name as a tag.


        Expects:

        - JSON with:

        - ''imageIds'': list of image IDs to add to the folder

        - ''folderName'': the name of the folder to add the images to

        - ''projectId''


        Process:

        1. Gets the project ID for each image

        2. Checks if the folder exists for each project

        3. Adds the folder name as a tag for each image that doesn''t already have it


        Returns:

        - Success message with results for each image

        - Detailed results including successful and failed operations'
      operationId: add_image_to_folder_endpoint_addImagesToFolder_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyFolderImagesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - AddImagesToFolder
components:
  schemas:
    ModifyFolderImagesRequest:
      properties:
        imageIds:
          items:
            type: string
          type: array
          title: Imageids
        folderName:
          type: string
          title: Foldername
        projectId:
          type: integer
          title: Projectid
      type: object
      required:
      - imageIds
      - folderName
      - projectId
      title: ModifyFolderImagesRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
