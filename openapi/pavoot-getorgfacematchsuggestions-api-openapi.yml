openapi: 3.2.0
info:
  title: Fast Get Org Face Match Suggestions API
  version: 0.1.0
tags:
- name: GetOrgFaceMatchSuggestions
paths:
  /getOrgFaceMatchSuggestions:
    get:
      summary: Get Org Face Match Suggestions Endpoint
      description: 'Org-wide face match suggestions (cross-project duplicates). Face crop + sample URLs are

        built from each person''s ORIGIN project prefix, so cross-project crops resolve correctly.'
      operationId: get_org_face_match_suggestions_endpoint_getOrgFaceMatchSuggestions_get
      parameters:
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      - name: status_filter
        in: query
        required: false
        schema:
          type: string
          description: pending | rejected | approved | ignored | all
          default: pending
          title: Status Filter
        description: pending | rejected | approved | ignored | all
      - name: countOnly
        in: query
        required: false
        schema:
          type: boolean
          description: Return only the suggestion count (cheap COUNT, no crop/sample URLs) — used for the /faces badge.
          default: false
          title: Countonly
        description: Return only the suggestion count (cheap COUNT, no crop/sample URLs) — used for the /faces badge.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetOrgFaceMatchSuggestions
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
