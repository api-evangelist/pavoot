openapi: 3.2.0
info:
  title: Fast Delete Project API
  version: 0.1.0
tags:
- name: DeleteProject
paths:
  /deleteProject:
    delete:
      summary: Delete Project Endpoint
      description: "Deletes a project and all associated data including images, folders, persons, and associations.\n\nQuery Parameters:\n    projectId (int): The ID of the project to delete (required)\n    \nReturns:\n    JSON response with:\n        - message: Success message\n        - project_id: The deleted project ID\n        \nErrors:\n    - 400 if projectId is missing\n    - 404 if project is not found\n    - 500 if deletion fails"
      operationId: delete_project_endpoint_deleteProject_delete
      parameters:
      - name: projectId
        in: query
        required: true
        schema:
          type: integer
          title: Projectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - DeleteProject
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
