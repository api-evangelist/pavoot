openapi: 3.2.0
info:
  title: Fast Edit Logo API
  version: 0.1.0
tags:
- name: EditLogo
paths:
  /editLogo:
    post:
      summary: Edit Logo Endpoint
      description: "Endpoint for editing a logo's information.\n\nArgs:\n    personId: The logo ID (frontend uses personId)\n    name: New brand name (optional)\n    category: When sent, updates category (empty -> brand). Omit to leave unchanged.\n    link: When sent, updates link (empty clears). Omit to leave unchanged.\n    contactEmail: When sent, updates contact email (empty clears). Omit to leave unchanged.\n\nReturns:\n    JSON response with success status and updated logo details"
      operationId: edit_logo_endpoint_editLogo_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_edit_logo_endpoint_editLogo_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - EditLogo
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_edit_logo_endpoint_editLogo_post:
      properties:
        personId:
          type: string
          title: Personid
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        contactEmail:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactemail
      type: object
      required:
      - personId
      title: Body_edit_logo_endpoint_editLogo_post
