openapi: 3.2.0
info:
  title: Fast Add Logo API
  version: 0.1.0
tags:
- name: AddLogo
paths:
  /addLogo:
    post:
      summary: Add Logo Endpoint
      description: 'Endpoint for adding a new logo to a project.


        Args:

        name: Logo/brand name

        projectId: Project ID

        category: Category (speaker, sponsor, etc.)

        logoImageId: S3 image ID for the logo

        image: S3 image ID (same as logoImageId)

        link: Optional link associated with the logo

        contactEmail: Optional contact email for the brand


        Returns:

        JSON response with success status and logo details'
      operationId: add_logo_endpoint_addLogo_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_add_logo_endpoint_addLogo_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - AddLogo
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Body_add_logo_endpoint_addLogo_post:
      properties:
        name:
          type: string
          title: Name
        projectId:
          type: string
          title: Projectid
        category:
          type: string
          title: Category
          default: speaker
        logoImageId:
          type: string
          title: Logoimageid
        image:
          type: string
          title: Image
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        contactEmail:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactemail
      type: object
      required:
      - name
      - projectId
      - logoImageId
      - image
      title: Body_add_logo_endpoint_addLogo_post
