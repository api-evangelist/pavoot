openapi: 3.2.0
info:
  title: Fast Count Images API
  version: 0.1.0
tags:
- name: CountImages
paths:
  /countImages:
    get:
      summary: Count Images Endpoint
      description: Count images for a project or multiple projects. For photographer role, returns only that photographer's count (backend enforces).
      operationId: count_images_endpoint_countImages_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          type: integer
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      - name: photographerId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Photographerid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - CountImages
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
