openapi: 3.2.0
info:
  title: Fast Get Project Locked Photographers API
  version: 0.1.0
tags:
- name: GetProjectLockedPhotographers
paths:
  /getProjectLockedPhotographers:
    get:
      summary: Get Project Locked Photographers Endpoint
      description: "Locked photographer ids (restriction reason 'photographer', migration 025).\n\nImages shot by these photographers are excluded from share links unless the link opts in —\nthis is what backs permanent licensing restrictions (e.g. agency images that media may use\nbut partners may not).\n\nSingle project  -> {projectId, lockedPhotographers: [...]}.\nprojectIds[]    -> additionally {locksByProject: {\"38\": [...], ...}} for the All-Projects\n                   photographers table, where one photographer can be locked in some of\n                   their projects and not others."
      operationId: get_project_locked_photographers_endpoint_getProjectLockedPhotographers_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetProjectLockedPhotographers
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
