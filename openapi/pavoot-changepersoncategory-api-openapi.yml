openapi: 3.2.0
info:
  title: Fast Change Person Category API
  version: 0.1.0
tags:
- name: ChangePersonCategory
paths:
  /changePersonCategory:
    put:
      summary: Change Person Category Endpoint
      description: "Change a person's creation type between 'user_added' and 'auto_detected'.\n\nArgs:\n    personId: The person's unique ID\n    newCategory: The new creation type ('user_added' or 'auto_detected')\n\nReturns:\n    JSON response with success status and updated person details"
      operationId: change_person_category_endpoint_changePersonCategory_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Body_change_person_category_endpoint_changePersonCategory_put'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - ChangePersonCategory
components:
  schemas:
    Body_change_person_category_endpoint_changePersonCategory_put:
      properties:
        personId:
          type: string
          title: Personid
        newCategory:
          type: string
          title: Newcategory
      type: object
      required:
      - personId
      - newCategory
      title: Body_change_person_category_endpoint_changePersonCategory_put
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
