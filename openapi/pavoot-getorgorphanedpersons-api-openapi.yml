openapi: 3.2.0
info:
  title: Fast Get Org Orphaned Persons API
  version: 0.1.0
tags:
- name: GetOrgOrphanedPersons
paths:
  /getOrgOrphanedPersons:
    get:
      summary: Get Org Orphaned Persons Endpoint
      description: Org-wide orphaned persons (faces are org-global). Org resolved from projectIds[0].
      operationId: get_org_orphaned_persons_endpoint_getOrgOrphanedPersons_get
      parameters:
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetOrgOrphanedPersons
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
