openapi: 3.2.0
info:
  title: Fast Update Project Custom Tag Categories API
  version: 0.1.0
tags:
- name: UpdateProjectCustomTagCategories
paths:
  /updateProjectCustomTagCategories:
    put:
      summary: Update Project Custom Tag Categories Endpoint
      description: 'Replaces all custom tag categories and their default options for a project.


        Request body:

        projectId (int, required)

        categories (list, required): each category:

        - name (str, required)

        - description (str, optional)

        - options (list[dict], optional) where each option has:

        - value (str, required)

        - label (str, optional)'
      operationId: update_project_custom_tag_categories_endpoint_updateProjectCustomTagCategories_put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - UpdateProjectCustomTagCategories
