openapi: 3.2.0
info:
  title: Fast Check Upload Limit API
  version: 0.1.0
tags:
- name: CheckUploadLimit
paths:
  /checkUploadLimit:
    get:
      summary: Check Upload Limit Endpoint
      description: 'Check if an upload would exceed the relevant organization''s storage and image tagging limits.


        Mode is derived from the authenticated user''s role (not from a query param):

        - event_organizer: use auth user as event organizer; projectId is not used.

        - photographer: projectId is required; resolve event organizer from event_organizer_projects for that project.

        - admin: projectId is required; same as photographer (project''s org limits).


        Only event_organizer, photographer, and admin may call. Recipients cannot upload.'
      operationId: check_upload_limit_endpoint_checkUploadLimit_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Required for photographer and admin; optional for event_organizer
          title: Projectid
        description: Required for photographer and admin; optional for event_organizer
      - name: uploadSizeMb
        in: query
        required: true
        schema:
          type: number
          title: Uploadsizemb
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - CheckUploadLimit
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
