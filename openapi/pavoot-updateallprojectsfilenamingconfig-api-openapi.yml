openapi: 3.2.0
info:
  title: Fast Update All Projects Filenaming Config API
  version: 0.1.0
tags:
- name: UpdateAllProjectsFilenamingConfig
paths:
  /updateAllProjectsFilenamingConfig:
    put:
      summary: Update All Projects Filenaming Config Endpoint
      description: 'Overwrites the filenaming configuration for MANY projects at once (the

        "All Projects" settings surface). For each project it writes the config and

        synchronously re-titles that project''s already-tagged images — so this can

        take a while on large accounts. Per-project failures are collected, not fatal.


        Request Body:

        projectIds (int[]): projects to overwrite (required)

        titleTemplate, filenameTemplate, copyrightMode, copyrightText (optional)'
      operationId: update_all_projects_filenaming_config_endpoint_updateAllProjectsFilenamingConfig_put
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - UpdateAllProjectsFilenamingConfig
