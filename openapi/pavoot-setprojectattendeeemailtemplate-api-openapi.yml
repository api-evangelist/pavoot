openapi: 3.2.0
info:
  title: Fast Set Project Attendee Email Template API
  version: 0.1.0
tags:
- name: SetProjectAttendeeEmailTemplate
paths:
  /setProjectAttendeeEmailTemplate:
    put:
      summary: Set Project Attendee Email Template Endpoint
      description: Save the email template into project_attendee_setup.
      operationId: set_project_attendee_email_template_endpoint_setProjectAttendeeEmailTemplate_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendeeEmailTemplateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - SetProjectAttendeeEmailTemplate
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AttendeeEmailTemplateRequest:
      properties:
        projectId:
          type: integer
          title: Projectid
        subject:
          type: string
          title: Subject
        bodyText:
          type: string
          title: Bodytext
      type: object
      required:
      - projectId
      - subject
      - bodyText
      title: AttendeeEmailTemplateRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
