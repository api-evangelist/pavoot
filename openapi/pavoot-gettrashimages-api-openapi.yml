openapi: 3.2.0
info:
  title: Fast Get Trash Images API
  version: 0.1.0
tags:
- name: GetTrashImages
paths:
  /getTrashImages:
    get:
      summary: Get Trash Images Endpoint
      description: 'Endpoint for retrieving deleted images (trash) for a single project, or across

        multiple projects (the "All Projects" view) when projectIds[] is provided.'
      operationId: get_trash_images_endpoint_getTrashImages_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      - name: photographerId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Photographerid
      - name: page
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 40
          title: Pagesize
      - name: sortBy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sortby
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetTrashImages
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
