openapi: 3.2.0
info:
  title: Fast Get Project Storage API
  version: 0.1.0
tags:
- name: GetProjectStorage
paths:
  /getProjectStorage:
    get:
      summary: Get Project Storage Endpoint
      description: "Returns storage breakdown for a project: normal (non-deleted) and trash (deleted) images.\n\nReturns:\n    dict with:\n        - normalGb: storage used by non-deleted images\n        - trashGb: storage used by deleted images\n        - totalGb: total storage (normal + trash)"
      operationId: get_project_storage_endpoint_getProjectStorage_get
      parameters:
      - name: projectId
        in: query
        required: true
        schema:
          type: integer
          description: Project ID
          title: Projectid
        description: Project ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetProjectStorage
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
