openapi: 3.2.0
info:
  title: Fast Get Recipient Projects API
  version: 0.1.0
tags:
- name: GetRecipientProjects
paths:
  /getRecipientProjects:
    get:
      summary: Get Recipient Projects Endpoint
      description: 'Retrieves all projects associated with a specific recipient.


        Query Parameters:

        recipientId (str): The ID of the recipient (required)


        Returns:

        JSON response containing:

        - projects: List of projects with their metadata

        Each project contains:

        - id

        - title

        - start_date

        - end_date

        - status


        Errors:

        - 400 if recipientId is missing

        - 404 if recipient is not found

        - 500 if database access fails'
      operationId: get_recipient_projects_endpoint_getRecipientProjects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - GetRecipientProjects
