openapi: 3.2.0
info:
  title: Fast Edit Recipient API
  version: 0.1.0
tags:
- name: EditRecipient
paths:
  /editRecipient:
    post:
      summary: Edit Recipient Endpoint
      description: "Updates a recipient's information in the database.\n\nExpects:\n    - JSON with:\n        - 'recipientId': unique identifier of the recipient (required)\n        - 'name': new name for the recipient (optional)\n        - 'primaryEmail': new primary email for the recipient (optional)\n        - 'description': new description for the recipient (optional)\n        - 'additionalEmails': list of additional emails (optional)\n        - 'projectId'\n\nReturns:\n    - Success message if recipient was found and updated\n    - Error if recipient not found or other issues occur"
      operationId: edit_recipient_endpoint_editRecipient_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - EditRecipient
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
