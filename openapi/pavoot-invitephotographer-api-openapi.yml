openapi: 3.2.0
info:
  title: Fast Invite Photographer API
  version: 0.1.0
tags:
- name: InvitePhotographer
paths:
  /invitePhotographer:
    post:
      summary: Invite Photographer Endpoint
      description: 'Invites a photographer by generating a password, saving them to the database, and sending an email.


        Expects:

        - JSON with:

        - ''name'': photographer''s name

        - ''email'': photographer''s email

        - ''description'': photographer''s description

        - ''projectId'': ID of the project to associate with


        Returns:

        - Success message with clerk_user_id if successful

        - Error if required fields are missing or other issues occur'
      operationId: invite_photographer_endpoint_invitePhotographer_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - InvitePhotographer
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
