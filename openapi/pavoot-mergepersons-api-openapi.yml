openapi: 3.2.0
info:
  title: Fast Merge Persons API
  version: 0.1.0
tags:
- name: MergePersons
paths:
  /mergePersons:
    post:
      summary: Merge Persons Endpoint
      description: Merges multiple persons into a single person.
      operationId: merge_persons_endpoint_mergePersons_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Merge Data
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - MergePersons
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
