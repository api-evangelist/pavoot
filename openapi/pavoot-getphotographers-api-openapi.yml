openapi: 3.2.0
info:
  title: Fast Get Photographers API
  version: 0.1.0
tags:
- name: GetPhotographers
paths:
  /getPhotographers:
    get:
      summary: Get Photographers Endpoint
      description: 'Retrieves photographers for a single project, or the union across multiple

        projects (the "All Projects" view).


        Query Parameters (one of):

        - projectId: A single project ID

        - projectIds[]: Multiple project IDs. Photographers are merged by identity

        (id) across projects, with totalImagesCount summed across them.


        Returns:

        JSON response with list of photographers containing:

        - id: unique identifier

        - name: photographer''s name

        - email: photographer''s email address

        - description: additional information about the photographer

        - isEventOrganizer: boolean indicating if photographer is also an event organizer

        - totalImagesCount: total number of images uploaded by this photographer


        Errors:

        - 400 if neither projectId nor projectIds[] is provided

        - 500 if database access fails'
      operationId: get_photographers_endpoint_getPhotographers_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetPhotographers
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
