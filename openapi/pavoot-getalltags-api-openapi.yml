openapi: 3.2.0
info:
  title: Fast Get All Tags API
  version: 0.1.0
tags:
- name: GetAllTags
paths:
  /getAllTags:
    get:
      summary: List Tags
      description: 'Retrieves unique tags from the database. For photographer role, always filters by that photographer''s images.

        If trash=true, only returns tags from images in trash (deleted_at IS NOT NULL).

        Accepts projectIds[] for multi-project aggregation.'
      operationId: list_tags_getAllTags_get
      parameters:
      - name: projectId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Projectid
      - name: projectIds[]
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
          default: []
          title: Projectids[]
      - name: photographerId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Photographerid
      - name: folderName
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Foldername
      - name: recipientId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Recipientid
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: personId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Personid
      - name: trash
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Trash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - GetAllTags
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
