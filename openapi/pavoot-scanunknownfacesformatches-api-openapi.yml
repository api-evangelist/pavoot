openapi: 3.2.0
info:
  title: Fast Scan Unknown Faces For Matches API
  version: 0.1.0
tags:
- name: ScanUnknownFacesForMatches
paths:
  /scanUnknownFacesForMatches:
    post:
      summary: Scan Unknown Faces For Matches Endpoint
      description: 'Scans all persons with name ''?'' (unknown) and finds Rekognition matches to named persons.

        Creates face_match_suggestions so user can approve merging unknown into known (giving unknown a name).

        Runs in background; returns immediately.'
      operationId: scan_unknown_faces_for_matches_endpoint_scanUnknownFacesForMatches_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              type: object
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - ScanUnknownFacesForMatches
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
