actions:
- target: $.info
  description: Replace the FastAPI framework defaults with the real product identity.
  update:
    title: Pavoot Application API
    description: 'Authenticated backend for the Pavoot AI event platform — event (project) management,
      event media upload and AI tagging, face and person identity resolution, sponsor brand and logo recognition,
      attendee registration and follow-up, gallery sharing, and organization permissions. This is a first-party
      application backend, not a published developer API: the OpenAPI and Swagger UI are publicly readable
      because FastAPI serves them by default, but Pavoot issues no API keys and documents no developer
      program.'
    contact:
      name: Pavoot
      email: hello@pavoot.com
      url: https://pavoot.com
    termsOfService: https://pavoot.com/client/gtc
- target: $
  description: Add the servers block the published document omits. Host confirmed by probe (HTTP 200 on
    /openapi.json, 401 on /me).
  update:
    servers:
    - url: https://api.pavoot.com
      description: Production (AWS Lambda function URL, eu-central-1)
- target: $.components
  description: Declare the security scheme and shared error responses the published document omits. Every
    operation except the token-scoped public ones returns 401 without a Clerk session JWT.
  update:
    securitySchemes:
      clerkSessionJWT:
        type: http
        scheme: bearer
        bearerFormat: JWT
        description: Clerk-issued session JWT. Issuer https://clerk.pavoot.com, RS256, JWKS at https://clerk.pavoot.com/.well-known/jwks.json.
          Note that a valid Clerk session does not imply membership of this application — see GET /me.
    responses:
      Unauthorized:
        description: Unauthorized — missing or invalid Clerk session token. No WWW-Authenticate challenge
          is returned.
        content:
          application/json:
            schema: &id001
              type: object
              properties:
                detail:
                  type: string
              title: PavootError
            example:
              detail: 'Unauthorized: Authentication failed'
      Forbidden:
        description: Forbidden — authenticated but lacking permission for the requested project or organization.
        content:
          application/json:
            schema: *id001
      NotFound:
        description: Not Found.
        content:
          application/json:
            schema: *id001
            example:
              detail: Not Found
