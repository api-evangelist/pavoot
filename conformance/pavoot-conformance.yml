- id: json-api
  name: 'JSON:API'
  conforms: false
  evidence: No JSON:API media type, envelope or conventions.
- id: asyncapi
  name: AsyncAPI
  conforms: false
  applicable: false
  evidence: >-
    Pavoot publishes no event or webhook surface. The three /emit_* operations are
