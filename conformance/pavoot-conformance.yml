compliance_certifications:
  published: false
  soc2: unknown
  iso27001: unknown
  gdpr_posture: >-
    Pavoot publishes a Data Processing Agreement (https://pavoot.com/client/dpa),
    a general privacy policy (https://pavoot.com/privacy), a separate attendee-facing
    privacy notice (https://pavoot.com/privacy-attendees) and a browser-extension
