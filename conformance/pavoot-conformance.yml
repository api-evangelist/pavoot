data_residency:
  region: eu-central-1
  evidence: >-
    api.pavoot.com resolves to an AWS Lambda function URL in eu-central-1
    (ec-bfdeb82aabcf4e709cc0dc9f4dcd8d0e.ecs.eu-central-1.on.aws). Relevant to
    GDPR posture given the biometric face data the platform processes, but Pavoot
    does not document residency itself.
biometric_note: >-
  The platform enrolls attendee faces into AWS Rekognition collections and makes a
  face photo mandatory at attendee registration. That places it in scope of
  biometric-data regimes (GDPR Art. 9 special-category data, and US state
  biometric privacy statutes such as BIPA). Pavoot publishes an attendee-specific
  privacy notice but no biometric-specific policy, retention schedule or consent
  artifact that could be verified anonymously.
