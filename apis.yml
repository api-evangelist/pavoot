apis:
- name: Pavoot Application API
  description: >-
    The authenticated backend for the Pavoot AI event platform. A FastAPI service
    publishing a complete OpenAPI 3.1.0 document at https://api.pavoot.com/openapi.json
    covering 248 operations and 56 request schemas: event (project) management,
    S3 presigned single-PUT and multipart media upload, a three-step asynchronous
    AI tagging pipeline (general, AWS Rekognition, BDA), face detection and person
    identity resolution with machine-proposed merge suggestions, sponsor brand and
    logo training and recognition, attendee registration with mandatory face
    capture, attendee follow-up email workflow, shareable galleries with review
    and flagging, photographer and recipient access management, storage and upload
    quotas, and a fine-grained organization permission system. Authenticated with
    Clerk-issued session JWTs; the published spec declares no securitySchemes, no
    servers, no tags and no typed responses, so the auth model, host and error
    surface in this profile were established by probing the live API. Not a
    developer product — there is no API key issuance, no plan, no rate limit, no
    versioning and no changelog.
