aid: pavoot
name: Pavoot
description: >-
  Pavoot is a Y Combinator-backed AI event-management platform that operates as
  an autonomous AI agent for running events end-to-end. It sources and matches
  the right attendees, personalizes invitations, captures and checks in guests
  on-site, automatically follows up with context from each interaction, tags
  event media (photos, faces, and logos) with AI, and attributes the resulting
  pipeline and ROI. The product targets field marketers, GTM leaders, sales
  teams, CMO/VP Marketing roles, and founders who want to turn events into
  pipeline. Pavoot runs no developer program — it issues no API keys, publishes
  no developer documentation and ships no SDKs — but its application backend at
  api.pavoot.com does serve a complete, publicly readable OpenAPI 3.1.0
  describing 248 operations across event projects, media upload and AI tagging,
  face and person identity resolution, sponsor brand and logo recognition,
  attendee registration and follow-up email, gallery sharing, and organization
  permissions, together with FastAPI Swagger UI and ReDoc. The API itself is
  authenticated with Clerk-issued session tokens against Pavoot's own OAuth 2.0
  / OpenID Connect authorization server at clerk.pavoot.com, so the contract is
  observable but not consumable by third parties.
