external_systems:
  note: >-
    Named in the provider's own operation descriptions — these are not inferred.
  systems:
  - name: Clerk
    role: authentication / session identity, shared across multiple Pavoot apps
    evidence_operation: get_me_me_get
  - name: AWS S3
    role: image storage via presigned single-PUT and multipart uploads
    evidence_operation: generate_presigned_urls_endpoint_generatePresignedUrls_post
  - name: AWS Rekognition
    role: face collection, enrollment and matching
    evidence_operation: admin_create_org_rekognition_collection
  - name: AWS SQS
    role: asynchronous tagging pipeline queues
    evidence_operation: add_images_route_addImages_post
  - name: AWS Bedrock (Claude)
    role: prompt-to-tag resolution
    evidence_operation: get_tags_from_prompt_ai_endpoint_getTagsFromPromptAI_post
  - name: BDA
    role: one of the three tagging pipeline steps (general, rekognition, bda)
    evidence_operation: get_tagging_failures_projects__project_id__images_tagging_failures_get
