  - invite_recipient_endpoint_inviteRecipient_post
  - share_images_with_recipient_endpoint_shareImagesWithRecipient_post
  - get_recipient_images_endpoint_getRecipientImages_get
- name: Share
  description: >-
    A shareable gallery link. Two flavours — scope-based (folders/people,
    auto-updating) and explicit image selections — combinable via /shares/create.
    Snapshot-able and previewable.
  key: shareId
  operations:
  - create_share_link_createShareLink_post
  - create_hybrid_share_shares_create_post
  - get_shares_getShares_get
  - update_share_updateShare_patch
  - snapshot_share_shares__id__snapshot_post
  - generate_share_links_shares_generate_post
- name: Review
  description: >-
    A review/flagging cycle over shared images, with flags, clear, close and reopen
    lifecycle operations.
  operations:
  - reviews
  - reviews_flags
  - reviews_close
  - reviews_reopen
- name: UploadLink
  description: >-
    A tokenized link that lets an external contributor upload into a project
    without a Pavoot account.
  operations:
  - create_upload_link_endpoint_createUploadLink_post
  - get_upload_links_endpoint_getUploadLinks_get
  - project_by_upload_token
  - upload_link_by_token
- name: PermissionPreset
  description: >-
    A named bundle of task permissions applied to org members, with a settable
    org default.
  operations:
