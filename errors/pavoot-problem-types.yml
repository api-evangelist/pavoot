    - approved
    - approved-none
    - approved-Pavoot
    - sent
    - auto-sent
    - email-failed
    note: >-
      /sendAttendeeEmails returns PARTIAL SUCCESS. A per-recipient failure sets
      that attendee's status to email-failed and records last_email_error, then
      the loop continues. A 200 does not mean every email was sent — the caller
      must re-read attendee status.
  - surface: image AI tagging
    operation: get_tagging_failures_projects__project_id__images_tagging_failures_get
    values:
    - pending
    - failed
    - stuck
    steps:
    - general
    - rekognition
    - bda
    note: >-
      Tagging is asynchronous over SQS. "stuck" is defined by the API as status
      'pending' for more than one hour. Recover with
      POST /projects/{project_id}/images/retry-tagging.
